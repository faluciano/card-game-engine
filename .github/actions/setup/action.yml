name: Setup Bun workspace
description: >-
  Install Bun (the version pinned by "packageManager" in package.json),
  restore the Bun install cache, and install dependencies with a frozen
  lockfile. Run actions/checkout first; this is a local action.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash
