name: Validate & Catalog Rulesets

on:
  push:
    branches: [main]
    paths:
      - "rulesets/**"
      - "packages/shared/src/schema/**"
      - "scripts/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deployments must land in order; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Validate rulesets
        run: bun run validate

      - name: Check JSON Schema is in sync with the Zod schema
        run: bun run schema:check

      - name: Build catalog
        run: bun run catalog

      - name: Upload catalog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: catalog
          path: catalog.json

  deploy-pages:
    needs: validate-and-catalog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download catalog artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: catalog

      - name: Prepare Pages directory
        run: |
          mkdir -p _site
          cp catalog.json _site/
          mkdir -p _site/rulesets
          cp rulesets/*.cardgame.json _site/rulesets/
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Card Game Engine — Catalog</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:2rem;max-width:800px;margin:0 auto}
              h1{margin-bottom:.5rem} p.sub{color:#8b949e;margin-bottom:2rem}
              .game{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1.25rem;margin-bottom:1rem}
              .game h2{font-size:1.1rem;margin-bottom:.25rem}
              .game .desc{color:#8b949e;font-size:.9rem;margin-bottom:.5rem}
              .tags{display:flex;gap:.4rem;flex-wrap:wrap}
              .tag{background:#1f6feb22;color:#58a6ff;font-size:.75rem;padding:2px 8px;border-radius:12px;border:1px solid #1f6feb44}
              .meta{color:#8b949e;font-size:.8rem;margin-top:.5rem}
              a{color:#58a6ff;text-decoration:none} a:hover{text-decoration:underline}
            </style>
          </head>
          <body>
            <h1>🃏 Card Game Engine</h1>
            <p class="sub">Browse available game rulesets — <a href="catalog.json">catalog.json</a></p>
            <div id="games"></div>
            <script>
              // Ruleset metadata is author-supplied, so it is rendered with
              // textContent/createElement rather than interpolated into HTML.
              const el = (tag, className, text) => {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text;
                return node;
              };
              fetch('catalog.json').then(r => r.json()).then(({ games }) => {
                const root = document.getElementById('games');
                for (const g of games) {
                  const card = el('div', 'game');
                  card.append(el('h2', null, g.name));
                  if (g.description) card.append(el('p', 'desc', g.description));
                  if (g.tags && g.tags.length) {
                    const tags = el('div', 'tags');
                    for (const t of g.tags) tags.append(el('span', 'tag', t));
                    card.append(tags);
                  }
                  const meta = el('p', 'meta', `${g.players.min}–${g.players.max} players · v${g.version} · `);
                  const link = el('a', null, `${g.slug}.cardgame.json`);
                  link.href = g.file;
                  meta.append(link);
                  card.append(meta);
                  root.append(card);
                }
              });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
