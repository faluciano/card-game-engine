name: Auto Release

# Every merge to main is released automatically once CI has passed for it.
# The version bump is derived from Conventional Commit messages since the
# last tag:
#   - feat!: / BREAKING CHANGE  -> major
#   - feat:                     -> minor
#   - anything else (fix, chore, docs, refactor, ...) -> patch
# A draft release is created first, the APK is built and attached to it, and
# only then is the release published (which also creates the tag). A failed
# APK build therefore never leaves a published release without an APK; the
# draft is deleted so the next merge can retry with the same version.
#
# Add "[skip release]" to a commit subject to opt a merge out of releasing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Releases are serialised and never cancelled: two merges in quick succession
# release one after the other, each seeing the previous tag.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  prepare:
    # Only a green CI run of a push to main releases. PR runs of CI also
    # complete, but their head_branch is the PR branch and event is
    # pull_request.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute next version and create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          skip() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Skip if explicitly opted out.
          SUBJECT=$(git log -1 --format='%s')
          if printf '%s' "$SUBJECT" | grep -qiE '\[skip release\]|\[no release\]'; then
            skip "Commit opted out of release ('$SUBJECT'); skipping."
          fi

          # Skip if HEAD is already tagged (e.g. a re-run).
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            skip "HEAD is already tagged; skipping."
          fi

          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          # Only ship when packages or app code changed since the last
          # release. Pipeline/CI config, docs, and other non-shipping files
          # don't warrant a new APK. (workflow_run has no paths filter, so
          # this replaces the old `paths-ignore`.)
          if [ -n "$LATEST" ]; then
            SHIPPING=$(git diff --name-only "$LATEST" HEAD \
              | grep -vE '^(\.github/|docs/|LICENSE$|\.gitignore$|\.editorconfig$)' \
              | grep -vE '\.md$' || true)
            if [ -z "$SHIPPING" ]; then
              skip "Only non-shipping files changed since $LATEST (docs, CI config); skipping."
            fi
          fi

          if [ -z "$LATEST" ]; then
            RANGE="HEAD"
            BASE="v0.0.0"
          else
            RANGE="${LATEST}..HEAD"
            BASE="$LATEST"
          fi
          CHANGES=$(git log --format='- %s (%h)' "$RANGE" | head -200)

          # Determine bump type from Conventional Commit messages. Match commit
          # *subjects* for the type/"!" prefix and commit *footers* for a
          # "BREAKING CHANGE:" line, so descriptive prose can't trip a bump.
          SUBJECTS=$(git log --format='%s' "$RANGE")
          FOOTERS=$(git log --format='%b' "$RANGE")
          BUMP=patch
          if printf '%s' "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
            || printf '%s' "$FOOTERS" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP=major
          elif printf '%s' "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          fi

          VER="${BASE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"

          echo "Releasing $NEXT ($BUMP bump from $BASE)." >> "$GITHUB_STEP_SUMMARY"

          # Group the notes by Conventional Commit type.
          BREAKING='^- [a-z]+(\([^)]*\))?!:'
          FEAT='^- feat(\([^)]*\))?:'
          FIX='^- fix(\([^)]*\))?:'
          BREAKING_LINES=$(grep -E "$BREAKING" <<< "$CHANGES" || true)
          REST=$(grep -vE "$BREAKING" <<< "$CHANGES" || true)
          FEAT_LINES=$(grep -E "$FEAT" <<< "$REST" || true)
          REST=$(grep -vE "$FEAT" <<< "$REST" || true)
          FIX_LINES=$(grep -E "$FIX" <<< "$REST" || true)
          OTHER_LINES=$(grep -vE "$FIX" <<< "$REST" || true)

          NOTES=$(printf 'Automated release on merge to main (%s bump from %s).' "$BUMP" "$BASE")
          append_section() {
            if [ -n "$2" ]; then
              NOTES=$(printf '%s\n\n### %s\n%s' "$NOTES" "$1" "$2")
            fi
          }
          append_section "Breaking changes" "$BREAKING_LINES"
          append_section "Features" "$FEAT_LINES"
          append_section "Fixes" "$FIX_LINES"
          append_section "Other changes" "$OTHER_LINES"

          # A draft left behind by an earlier failed run would collide; a
          # draft has no tag, so deleting it is safe.
          if [ "$(gh release view "$NEXT" --json isDraft -q .isDraft 2>/dev/null || true)" = "true" ]; then
            echo "Deleting stale draft release $NEXT."
            gh release delete "$NEXT" --yes
          fi

          gh release create "$NEXT" \
            --draft \
            --target "$HEAD_SHA" \
            --title "$NEXT" \
            --notes "$NOTES"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-apk.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [prepare, build]
    if: failure() && needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release after failed APK build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --yes
            echo "APK build failed; deleted draft release $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
